<svg width="1600" height="460" viewBox="0 0 1600 460" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="460" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07090D"/>
    <stop offset="0.55" stop-color="#0B1017"/>
    <stop offset="1" stop-color="#07090D"/>
  </linearGradient>
  <linearGradient id="accent" x1="250" y1="0" x2="1400" y2="460" gradientUnits="userSpaceOnUse">
    <stop stop-color="#75F5C8"/>
    <stop offset="0.5" stop-color="#69B7FF"/>
    <stop offset="1" stop-color="#B58CFF"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="18" result="blur"/>
  </filter>
  <pattern id="grid" width="80" height="60" patternUnits="userSpaceOnUse">
    <path d="M 80 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
  </pattern>
</defs>

<rect width="1600" height="460" fill="url(#bg)"/>
<rect width="1600" height="460" fill="url(#grid)"/>

<circle cx="1260" cy="110" r="135" fill="#69B7FF" fill-opacity="0.045" filter="url(#glow)"/>
<circle cx="1400" cy="330" r="160" fill="#75F5C8" fill-opacity="0.035" filter="url(#glow)"/>

<!-- terminal window -->
<rect x="1030" y="72" width="420" height="245" rx="18" fill="#0C1118" stroke="#FFFFFF" stroke-opacity="0.10"/>
<circle cx="1060" cy="101" r="6" fill="#FF6B6B" fill-opacity="0.9"/>
<circle cx="1082" cy="101" r="6" fill="#FFD166" fill-opacity="0.9"/>
<circle cx="1104" cy="101" r="6" fill="#75F5C8" fill-opacity="0.9"/>
<text x="1060" y="145" fill="#7B8794" font-family="monospace" font-size="16">$ whoami</text>
<text x="1060" y="177" fill="#F4F7FA" font-family="monospace" font-size="21">AbhijeetGajbhiye</text>
<text x="1060" y="214" fill="#7B8794" font-family="monospace" font-size="16">$ focus</text>
<text x="1060" y="246" fill="#69B7FF" font-family="monospace" font-size="19">data / engineering / code</text>
<text x="1060" y="282" fill="#7B8794" font-family="monospace" font-size="16">$ status</text>
<text x="1060" y="307" fill="#75F5C8" font-family="monospace" font-size="17">building...</text>
<rect x="1190" y="291" width="11" height="20" fill="#75F5C8"/>

<!-- main copy -->
<text x="110" y="148" fill="#7B8794" font-family="monospace" font-size="18" letter-spacing="4">HELLO, WORLD / GITHUB PROFILE</text>
<text x="105" y="222" fill="#F4F7FA" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">ABHIJEET</text>
<text x="105" y="287" fill="#F4F7FA" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">GAJBHIYE</text>
<rect x="106" y="322" width="470" height="2" fill="url(#accent)"/>
<text x="106" y="361" fill="#AAB4C0" font-family="monospace" font-size="21">engineering × analytics × curiosity</text>
<text x="106" y="399" fill="#697585" font-family="monospace" font-size="16">learn → build → analyze → iterate</text>
</svg>
